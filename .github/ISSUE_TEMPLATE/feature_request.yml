name: Feature Request
description: Suggest a new feature or improvement
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Frontend Performance Lab!

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the project would this improve?
      options:
        - Analyzer (new AST rule)
        - MCP Server (new tool or resource)
        - New Experiment
        - New Recipe
        - New Browser API
        - UI / Web app
        - Documentation
        - CI/CD / Developer tooling
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the problem or limitation you're running into.
      placeholder: "I'm frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you've thought about?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or examples that help explain your request.
