name: MCP / AI Integration Issue
description: Report a problem with the MCP server or AI assistant integration
title: '[MCP]: '
labels: ['mcp', 'bug']
body:
  - type: markdown
    attributes:
      value: |
        Use this template for issues related to the MCP server, IDE connectivity, or AI tool responses.

  - type: dropdown
    id: client
    attributes:
      label: AI client / IDE
      options:
        - Cursor
        - Claude Code
        - VS Code (Cline)
        - VS Code (Roo)
        - Windsurf
        - Continue.dev
        - Gemini CLI
        - Other
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue type
      options:
        - Server fails to start
        - IDE shows "Disconnected"
        - Tool returns wrong or empty results
        - Wrong tool listed or missing tool
        - Performance / timeout
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3.
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version (`node -v`)
      placeholder: 'e.g. v22.13.1'
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: MCP server config (redact secrets)
      description: Paste your IDE's MCP server JSON config.
      render: json

  - type: textarea
    id: logs
    attributes:
      label: Server error output
      description: Run `npm run mcp:start` manually and paste any errors.
      render: shell
