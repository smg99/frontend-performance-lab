name: Frontend Performance Lab CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  analyze-performance:
    name: AST Performance Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Run FPL Analyzer Action
        uses: ./.github/actions/fpl-analyzer
        with:
          directory: './app'
        # Exits with code 1 (fails CI) when Critical or High severity issues are found
