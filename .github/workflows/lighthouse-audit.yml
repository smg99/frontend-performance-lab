name: Lighthouse and accessibility audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npx nuxt prepare

      - name: Build production site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse on representative routes
        run: npm run audit:lighthouse -- --out .fpl/lighthouse-report.json

      - name: Run static accessibility checks
        if: always()
        run: npm run --silent audit:accessibility > .fpl/accessibility-report.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-lighthouse-audit-${{ github.sha }}
          path: |
            .fpl/lighthouse-report.json
            .fpl/accessibility-report.json
          if-no-files-found: warn
