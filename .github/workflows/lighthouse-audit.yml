name: Lighthouse and accessibility audit

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare Nuxt
        run: npx nuxt prepare

      - name: Build production site
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Restore previous Lighthouse trend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .fpl/previous
          PREVIOUS_RUN_ID="$(gh run list --workflow lighthouse-audit.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$PREVIOUS_RUN_ID" ]; then
            echo "No previous successful Lighthouse run; starting trend history."
            exit 0
          fi

          ARTIFACT_COUNT="$(gh api "repos/{owner}/{repo}/actions/runs/$PREVIOUS_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "fpl-lighthouse-trend" and .expired == false)] | length')"
          if [ "$ARTIFACT_COUNT" -gt 0 ]; then
            gh run download "$PREVIOUS_RUN_ID" --name fpl-lighthouse-trend --dir .fpl/previous
            test -s .fpl/previous/lighthouse-trend.json
          else
            echo "Previous successful run has no trend artifact; starting trend history."
          fi

      - name: Run Lighthouse on representative routes
        run: npm run audit:lighthouse -- --out .fpl/lighthouse-report.json

      - name: Update cross-run Lighthouse trend
        run: >-
          npm run audit:lighthouse:trend --
          --current .fpl/lighthouse-report.json
          --previous .fpl/previous/lighthouse-trend.json
          --out .fpl/lighthouse-trend.json
          --run-id "$GITHUB_RUN_ID"

      - name: Run static accessibility checks
        if: always()
        run: npm run --silent audit:accessibility > .fpl/accessibility-report.json

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpl-lighthouse-audit-${{ github.sha }}
          path: |
            .fpl/lighthouse-report.json
            .fpl/lighthouse-trend.json
            .fpl/accessibility-report.json
          overwrite: true
          if-no-files-found: warn

      - name: Upload Lighthouse trend history
        uses: actions/upload-artifact@v4
        with:
          name: fpl-lighthouse-trend
          path: .fpl/lighthouse-trend.json
          overwrite: true
          retention-days: 90
          if-no-files-found: error
