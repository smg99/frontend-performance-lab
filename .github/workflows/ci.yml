name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Coverage
        run: npm run test:coverage

      - name: Production Build
        run: npm run build

      - name: MCP Validation
        run: npm run validate:mcp

      - name: Analyzer Validation
        run: npm run validate:analyzer
